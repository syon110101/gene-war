<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유전자 전쟁: 최강의 군단</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#e9efff;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#24365c,#0b1020 55%);min-height:100vh}header{padding:22px 4%;border-bottom:1px solid #354261;background:#10192cbb}h1{margin:0;font-size:27px}small,.muted{color:#9daecb}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 4%}button{cursor:pointer;border:1px solid #536ba0;background:#253b68;color:white;padding:10px 14px;border-radius:10px;font-weight:700}button:hover{background:#37538b}button:disabled{opacity:.4;cursor:not-allowed}.active,.primary{background:#5365c9}main{padding:0 4% 40px;max-width:1450px;margin:auto}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.stat,.panel,.creature{background:#17233b;border:1px solid #334362;border-radius:16px;padding:17px}.stat strong{font-size:22px;color:#c2d4ff}.panel{margin:14px 0}.creature{position:relative;min-height:270px}.creature.selected{outline:2px solid #7ba9ff}.sprite{width:140px;height:130px;margin:auto;display:block}.title{font-weight:800;font-size:18px}.tag{font-size:12px;color:#b7c9ef;background:#263a5e;padding:3px 7px;border-radius:7px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.bar{height:7px;border-radius:10px;background:#354461;overflow:hidden}.bar span{display:block;height:100%;background:#70d2b4}select,input{background:#0d1830;color:#fff;border:1px solid #536585;border-radius:8px;padding:10px;max-width:100%}section[hidden]{display:none}#toast{position:fixed;bottom:18px;right:18px;background:#dbe8ff;color:#0d1830;padding:14px;border-radius:12px;display:none;z-index:10}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.log{max-height:260px;overflow:auto;white-space:pre-line;background:#0c1629;padding:14px;border-radius:10px;line-height:1.7}.formation{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr));gap:10px}.slot{border:1px dashed #6d80ab;border-radius:10px;padding:12px;min-height:65px}.slot.front{background:#253957}.slot.back{background:#1a2b48}h2{margin:12px 0}p{line-height:1.55}@media(max-width:600px){h1{font-size:21px}.formation{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>🧬 유전자 전쟁: 최강의 군단</h1><small>GENE WAR: THE STRONGEST LEGION · 연구소 지휘관</small></header><nav id="nav"></nav><main><div id="resources" class="stats"></div><div id="view"></div></main><div id="toast"></div><script>
const KEY='gene-war-save-v1';const loci=['A','B','C'];const traits={A:['파란색','노란색'],B:['단단한 외골격','부드러운 외골격'],C:['큰 날개','작은 날개']};const tabs=['연구소','생명체','교배 시설','군단·전투','훈련·연구','유전자 도감'];let tab='연구소';let state;let parent1='',parent2='',selected='';const rand=n=>Math.floor(Math.random()*n);const pick=a=>a[rand(a.length)];const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const genotype=()=>Object.fromEntries(loci.map(l=>[l,pick([l,l.toLowerCase()])+pick([l,l.toLowerCase()])]));const expressed=(g,l)=>g[l].includes(l);const gstr=g=>loci.map(l=>g[l]).join(' ');const key=g=>loci.map(l=>g[l].split('').sort((a,b)=>a===l?-1:b===l?1:0).join('')).join('-');
function create(g=genotype(),parents=[],generation=1){const id=uid(),hard=expressed(g,'B'),wing=expressed(g,'C'),blue=expressed(g,'A');return{id,name:'개체-'+id.slice(0,4).toUpperCase(),species:'에테르 비스트',g,parents,generation,level:1,xp:0,bonus:0,hp:85+(hard?18:6)+(blue?5:12),atk:15+(wing?5:2)+(blue?1:4),def:6+(hard?7:2),speed:wing?1.25:1.5,created:new Date().toLocaleString('ko-KR')}}
function init(){let a=create({A:'Aa',B:'Bb',C:'Cc'}),b=create({A:'aa',B:'Bb',C:'cc'}),c=create({A:'AA',B:'bb',C:'Cc'});return{units:[a,b,c],gold:350,data:90,energy:130,crystal:5,stage:1,wins:0,capacity:12,lab:1,training:1,formation:[a.id,b.id,c.id,null,null,null],seen:{[key(a.g)]:1,[key(b.g)]:1,[key(c.g)]:1},log:['연구소가 설립되었습니다. 첫 군단을 편성하세요.']}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.units))return x}catch(e){}return init()}state=load();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2800)}function unit(id){return state.units.find(x=>x.id===id)}function stats(u){return{hp:u.hp+(u.level-1)*10+u.bonus*4,atk:u.atk+(u.level-1)*3+u.bonus*2,def:u.def+(u.level-1)*2+u.bonus,speed:u.speed}}function sprite(u){let blue=expressed(u.g,'A'),hard=expressed(u.g,'B'),big=expressed(u.g,'C'),body=blue?'#5e9dff':'#f5c75c';return `<svg class="sprite" viewBox="0 0 160 145" role="img" aria-label="${blue?'파란':'노란'} 생명체"><ellipse cx="80" cy="132" rx="52" ry="8" fill="#0b1428"/><path d="M57 71 Q${big?5:35} ${big?2:43} ${big?18:43} ${big?98:91} L60 94Z" fill="#9b8ce8" stroke="#d3c8ff" stroke-width="3"/><path d="M103 71 Q${big?155:125} ${big?2:43} ${big?142:117} ${big?98:91} L100 94Z" fill="#9b8ce8" stroke="#d3c8ff" stroke-width="3"/><path d="M49 118L40 131M111 118L120 131" stroke="${body}" stroke-width="11" stroke-linecap="round"/><ellipse cx="80" cy="89" rx="42" ry="41" fill="${body}" stroke="${hard?'#dbe9ff':'#b69a6a'}" stroke-width="${hard?7:3}"/><path d="M55 51L48 28L73 46M105 51L112 28L87 46" fill="${body}" stroke="#c3d5ff" stroke-width="3"/><circle cx="66" cy="81" r="6" fill="#13243b"/><circle cx="94" cy="81" r="6" fill="#13243b"/><path d="M73 99Q80 107 87 99" fill="none" stroke="#27364c" stroke-width="3" stroke-linecap="round"/>${hard?'<path d="M46 108L60 117L80 110L100 117L114 108" fill="none" stroke="#e6efff" stroke-width="4"/>':''}</svg>`}
function card(u,actions=''){let s=stats(u);return `<div class="creature">${sprite(u)}<div class="title">${u.name} <span class="tag">G${u.generation} · Lv.${u.level}</span></div><div class="tags"><span class="tag">${gstr(u.g)}</span><span class="tag">${expressed(u.g,'A')?'파랑':'노랑'}</span><span class="tag">${expressed(u.g,'B')?'단단':'부드러움'}</span><span class="tag">${expressed(u.g,'C')?'큰 날개':'작은 날개'}</span></div><div>❤️ ${s.hp}　⚔️ ${s.atk}　🛡️ ${s.def}　⚡ ${s.speed.toFixed(2)}</div><small>경험치 ${u.xp}/${u.level*35} · 부모 ${u.parents.length?u.parents.map(id=>unit(id)?.name||'기록 없음').join(', '):'시조'}</small><div class="row" style="margin-top:12px">${actions}</div></div>`}
function button(label,fn){return `<button onclick="${fn}">${label}</button>`}function render(){document.querySelector('#nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="changeTab('${t}')">${t}</button>`).join('');document.querySelector('#resources').innerHTML=[['🪙 골드',state.gold],['🔬 연구 데이터',state.data],['💚 생명 에너지',state.energy],['💎 결정 조각',state.crystal],['🏠 수용량',`${state.units.length}/${state.capacity}`],['🏆 승리',state.wins]].map(([n,v])=>`<div class="stat"><small>${n}</small><br><strong>${v}</strong></div>`).join('');let html='';if(tab==='연구소')html=home();if(tab==='생명체')html=`<h2>보유 생명체</h2><div class="grid">${state.units.map(u=>card(u,button('이름 변경',`renameUnit('${u.id}')`)+button('혈통 보기',`lineage('${u.id}')`))).join('')}</div>`;if(tab==='교배 시설')html=breedView();if(tab==='군단·전투')html=battleView();if(tab==='훈련·연구')html=upgradeView();if(tab==='유전자 도감')html=dexView();document.querySelector('#view').innerHTML=html}
function changeTab(t){tab=t;render()}function home(){return `<div class="panel"><h2>지휘관님, 연구소에 오신 것을 환영합니다.</h2><p>전투로 자원을 확보하고, 생명체를 교배해 유전자 조합을 발견하세요. 교배는 형질별로 부모의 대립유전자를 하나씩 무작위로 전달합니다.</p><div class="row">${button('🧬 교배 시작',"changeTab('교배 시설')")}${button('⚔️ 전투 시작',"changeTab('군단·전투')")}${button('📖 도감 보기',"changeTab('유전자 도감')")}</div></div><div class="panel"><h2>최근 기록</h2><div class="log">${state.log.slice(-12).reverse().join('\n')}</div></div>`}
function breedView(){let options=state.units.map(u=>`<option value="${u.id}">${u.name} (${gstr(u.g)})</option>`).join('');if(!unit(parent1))parent1=state.units[0]?.id||'';if(!unit(parent2))parent2=state.units[1]?.id||state.units[0]?.id||'';let a=unit(parent1),b=unit(parent2);return `<div class="panel"><h2>🧬 번식 시설</h2><p>교배 비용: 생명 에너지 25 + 골드 30 · 보유 한도 ${state.capacity}마리</p><div class="row"><label>부모 1 <select onchange="parent1=this.value;render()">${options.replace(`value="${parent1}"`,`value="${parent1}" selected`)}</select></label><label>부모 2 <select onchange="parent2=this.value;render()">${options.replace(`value="${parent2}"`,`value="${parent2}" selected`)}</select></label>${button('자손 탄생', 'breed()')}</div><p>부모 유전자: ${a?gstr(a.g):'-'} × ${b?gstr(b.g):'-'}</p><h3>자손 유전자 확률</h3>${a&&b?loci.map(l=>`<p>${l} 형질: ${Object.entries(prob(a.g[l],b.g[l],l)).map(([g,p])=>`${g} ${(p*100).toFixed(0)}%`).join(' · ')}</p>`).join(''):''}</div>`}
function prob(a,b,l){let out={};for(let x of a)for(let y of b){let g=[x,y].sort((p,q)=>p===l?-1:q===l?1:0).join('');out[g]=(out[g]||0)+.25}return out}function breed(){let a=unit(parent1),b=unit(parent2);if(!a||!b||a.id===b.id)return toast('서로 다른 부모 두 마리를 선택하세요.');if(state.units.length>=state.capacity)return toast('기지 수용량을 늘려주세요.');if(state.energy<25||state.gold<30)return toast('교배 자원이 부족합니다.');let g={};for(let l of loci)g[l]=pick([...a.g[l]])+pick([...b.g[l]]);let child=create(g,[a.id,b.id],Math.max(a.generation,b.generation)+1);state.units.push(child);state.energy-=25;state.gold-=30;let k=key(g),newGene=!state.seen[k];state.seen[k]=(state.seen[k]||0)+1;if(newGene){state.data+=15;state.crystal+=1}state.log.push(`${child.name} 탄생! ${gstr(g)}${newGene?' · 신규 유전자 조합 발견!':''}`);save();render();toast(`🎉 ${child.name} 탄생! ${gstr(g)}`)}
function battleView(){let options=`<option value="">— 비우기 —</option>`+state.units.map(u=>`<option value="${u.id}">${u.name} Lv.${u.level}</option>`).join('');return `<div class="panel"><h2>⚔️ 군단 편성</h2><p>앞줄은 공격을 먼저 받습니다. 뒷줄은 앞줄이 살아 있는 동안 보호받습니다. 각 개체는 공격 속도에 따라 행동합니다.</p><div class="formation">${state.formation.map((id,i)=>`<div class="slot ${i<3?'front':'back'}"><b>${i<3?'전열':'후열'} ${i%3+1}</b><br><select onchange="setSlot(${i},this.value)">${options.replace(`value="${id||''}"`,`value="${id||''}" selected`)}</select></div>`).join('')}</div><div class="row" style="margin-top:14px">${button('최강 자동 편성','autoFormation()')}${button(`스테이지 ${state.stage} 전투 시작`,'fight()')}</div></div><div class="panel"><h2>전투 기록</h2><div class="log">${state.log.filter(x=>x.includes('전투')||x.includes('승리')||x.includes('패배')).slice(-12).reverse().join('\n')||'아직 전투 기록이 없습니다.'}</div></div>`}
function setSlot(i,id){if(id&&state.formation.some((x,j)=>j!==i&&x===id))return toast('같은 생명체는 중복 편성할 수 없습니다.');state.formation[i]=id||null;save();render()}function autoFormation(){state.formation=[...state.units].sort((a,b)=>{let x=stats(a),y=stats(b);return(y.hp+y.atk*5+y.def*4)-(x.hp+x.atk*5+x.def*4)}).slice(0,6).map(u=>u.id);while(state.formation.length<6)state.formation.push(null);save();render()}
function fight(){let army=state.formation.map((id,i)=>id?{u:unit(id),pos:i}:null).filter(x=>x&&x.u);if(!army.length)return toast('군단을 편성하세요.');let allies=army.map(({u,pos})=>({...stats(u),name:u.name,pos,id:u.id,cur:stats(u).hp,charge:0}));let enemies=Array.from({length:Math.min(3+Math.floor(state.stage/3),6)},(_,i)=>({name:`그림자 ${i+1}`,hp:55+state.stage*12,cur:55+state.stage*12,atk:10+state.stage*3,def:3+state.stage,speed:1+state.stage*.04,charge:0,pos:i}));let events=[];function target(group){let alive=group.filter(x=>x.cur>0);if(!alive.length)return null;let front=alive.filter(x=>x.pos<3);return pick(front.length?front:alive)}for(let tick=0;tick<180&&allies.some(x=>x.cur>0)&&enemies.some(x=>x.cur>0);tick++){let actors=[...allies.map(x=>({...x,side:0})),...enemies.map(x=>({...x,side:1}))];for(let a of actors){let original=(a.side?enemies:allies).find(x=>x.name===a.name);if(!original||original.cur<=0)continue;original.charge+=original.speed;if(original.charge<1)continue;original.charge-=1;let t=target(a.side?allies:enemies);if(!t)break;let dmg=Math.max(1,Math.round(original.atk*(.85+Math.random()*.3)-t.def*.6));t.cur-=dmg;if(events.length<26)events.push(`${original.name} → ${t.name} ${dmg} 피해${t.cur<=0?' (격파)':''}`)}}let win=allies.some(x=>x.cur>0)&&!enemies.some(x=>x.cur>0);if(win){let gold=60+state.stage*18,data=12+state.stage*3,energy=20+state.stage*2;state.gold+=gold;state.data+=data;state.energy+=energy;state.wins++;state.stage++;for(let a of army){let u=a.u;u.xp+=25+state.stage*6;while(u.xp>=u.level*35){u.xp-=u.level*35;u.level++}}state.log.push(`스테이지 ${state.stage-1} 전투 승리! 골드 +${gold}, 데이터 +${data}, 에너지 +${energy}`)}else{state.energy+=8;state.log.push(`스테이지 ${state.stage} 전투 패배. 군단을 훈련하고 재도전하세요.`)}save();render();let box=document.querySelector('#view');box.insertAdjacentHTML('afterbegin',`<div class="panel"><h2>${win?'🏆 승리!':'💥 패배'}</h2><div class="log">${events.join('\n')}</div></div>`)}
function upgradeView(){return `<div class="grid"><div class="panel"><h2>🏠 기지 확장</h2><p>현재 수용량: ${state.capacity}마리</p>${button('수용량 +6 (골드 180, 결정 2)','expand()')}</div><div class="panel"><h2>🔬 연구소 Lv.${state.lab}</h2><p>연구 수준을 높이면 연구 데이터로 생명 에너지를 생성할 수 있습니다.</p>${button('연구소 업그레이드 (데이터 70, 골드 100)','labUp()')}${button(`에너지 +${30+state.lab*10} (데이터 25)`,'convertEnergy()')}</div><div class="panel"><h2>🏋️ 개체 훈련</h2><p>골드 45, 에너지 12를 사용해 개체의 능력치를 영구 강화합니다.</p><select id="trainUnit">${state.units.map(u=>`<option value="${u.id}">${u.name} (훈련 ${u.bonus})</option>`).join('')}</select>${button('훈련','train()')}</div></div>`}function pay(g=0,d=0,e=0,c=0){if(state.gold<g||state.data<d||state.energy<e||state.crystal<c){toast('자원이 부족합니다.');return false}state.gold-=g;state.data-=d;state.energy-=e;state.crystal-=c;return true}function expand(){if(!pay(180,0,0,2))return;state.capacity+=6;save();render()}function labUp(){if(!pay(100,70))return;state.lab++;save();render()}function convertEnergy(){if(!pay(0,25))return;state.energy+=30+state.lab*10;save();render()}function train(){let id=document.querySelector('#trainUnit').value;if(!pay(45,0,12))return;unit(id).bonus++;save();render();toast('훈련 완료!')}
function dexView(){let combos=Object.keys(state.seen);return `<div class="panel"><h2>📖 유전자 도감</h2><p>발견한 유전자형 조합: <b>${combos.length} / 27</b> · 각 형질 3가지 유전자형, 총 3³ = 27가지</p><div class="bar"><span style="width:${combos.length/27*100}%"></span></div><p>발견 기록: ${combos.map(k=>`<span class="tag">${k} (${state.seen[k]}회)</span>`).join(' ')}</p><h3>형질 설명</h3><p>A/a: 파랑/노랑 · B/b: 단단함/부드러움 · C/c: 큰 날개/작은 날개</p></div><div class="grid">${state.units.map(u=>card(u,button('혈통 확인',`lineage('${u.id}')`))).join('')}</div>`}
function renameUnit(id){let u=unit(id),n=prompt('생명체 이름을 입력하세요.',u.name);if(n&&n.trim()){u.name=n.trim().slice(0,24);save();render()}}function lineage(id){let u=unit(id);let chain=(x,depth=0)=>{if(!x||depth>8)return '';return `${'　'.repeat(depth)}${x.name} (G${x.generation}, ${gstr(x.g)})\n`+x.parents.map(p=>chain(unit(p),depth+1)).join('')};let children=state.units.filter(x=>x.parents.includes(id));alert(`🧬 ${u.name} 혈통\n\n${chain(u)}\n자손: ${children.map(x=>x.name).join(', ')||'없음'}`)}function resetGame(){if(confirm('저장된 진행 상태를 모두 삭제하고 새로 시작할까요?')){state=init();save();tab='연구소';render()}}window.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='r'){e.preventDefault();resetGame()}});render();
</script><script src="battle.js"></script>
</body></html>
